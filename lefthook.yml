pre-commit:
  jobs:
    - name: eslint
      glob: "*.{js,mjs,cjs,ts,tsx}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    - name: prettier
      glob: "*.{js,mjs,cjs,ts,tsx,json,md,css,yml,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
