name: granabank

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 10s

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: granabank
      POSTGRES_PASSWORD: granabank
      POSTGRES_DB: granabank
    ports:
      - "5442:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/<major>/docker.
      - db-data:/var/lib/postgresql
    healthcheck: *postgres-healthcheck

  db-test:
    profiles: [test]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: granabank
      POSTGRES_PASSWORD: granabank
      POSTGRES_DB: granabank_test
    ports:
      - "5443:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck: *postgres-healthcheck

volumes:
  db-data:
