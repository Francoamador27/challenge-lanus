name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit, integration and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://granabank:granabank@localhost:5432/granabank_test
      TEST_DATABASE_URL: postgresql://granabank:granabank@localhost:5432/granabank_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: granabank
          POSTGRES_PASSWORD: granabank
          POSTGRES_DB: granabank_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U granabank -d granabank_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  e2e:
    name: End-to-end
    needs: checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://granabank:granabank@localhost:5432/granabank
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: granabank
          POSTGRES_PASSWORD: granabank
          POSTGRES_DB: granabank
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U granabank -d granabank"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
